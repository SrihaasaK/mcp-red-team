[project]
name = "mcp-redteam-harness"
version = "0.1.0"
description = "Dynamic red-team harness for MCP agents: a transparent proxy that injects attacks, measures attack success rate, and ships an information-flow mitigation layer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Srihaasa Karyampudi" }]
keywords = ["mcp", "red-team", "security", "prompt-injection", "agents", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
mcpr = "mcpredteam.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution name is `mcp-redteam-harness` (the PyPI name), but the import package and the `mcpr`
# entry point stay `mcpredteam` (src/mcpredteam/), like scikit-learn -> import sklearn.
module-name = "mcpredteam"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "probe",  # throwaway M0 measurement scripts (not shipped)
    # Historical M2 review-packet generators that cannot reproduce their committed packets in the
    # current (post-Orca-migration) tree (D61 canary hydration / path drift) -- see their header
    # notes. Kept ruff-excluded (D106/D107). (gen_corpus.py moved to legacy/ and is now lint-clean.)
    "review/M2/sample_review_packet.py",
    "review/M2/v2/sample_review_packet.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default values; these calls are not mutable state.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
