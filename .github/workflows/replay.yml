name: replay

# Reproducibility gate (SPEC §9.1): sync frozen, run the offline unit suite, then replay
# the committed recordings with ZERO live model calls. No secrets are referenced and no
# model keys are set, so a model call cannot succeed even if one were attempted.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    # ubuntu-latest per author decision D60 (supersedes the D46 macos-14 pin; D46 left intact as
    # history, see D74). The lockfiles resolve manylinux x86_64 wheels for every platform-specific
    # package incl. claude-agent-sdk 0.2.164 (manylinux_2_17_x86_64), so `uv sync --frozen` works on
    # linux. Replay serves recorded SSE by sequence and request diffs are diagnostic-only, so the
    # darwin-made recordings replay here; this first Actions run IS the linux reproducibility proof.
    # D107: pinned to ubuntu-24.04 (decision #6) so the reproducibility runner is FIXED, not the
    # moving `ubuntu-latest` label (which GitHub migrates to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    env:
      # Replay is offline. Leave the model keys unset so a live call is impossible.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync root + each scaffold project (frozen)
        run: |
          uv sync --frozen
          uv sync --frozen --project scaffolds/openai-agents
          uv sync --frozen --project scaffolds/langgraph
          uv sync --frozen --project scaffolds/claude-agent-sdk

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit suite (offline; keys unset)
        run: uv run pytest -q

      - name: Replay committed recordings — zero live calls (SPEC §9.1)
        run: |
          uv run mcpr replay tests/recordings/m1/m1-matrix        --out "$RUNNER_TEMP/rep-m1"
          uv run mcpr replay tests/recordings/m2-dev              --out "$RUNNER_TEMP/rep-m2"
          uv run mcpr replay tests/recordings/m3-langgraph        --out "$RUNNER_TEMP/rep-lg"
          uv run mcpr replay tests/recordings/m3-claude-agent-sdk --out "$RUNNER_TEMP/rep-cas"
          uv run mcpr replay tests/recordings/m3-openai-benign    --out "$RUNNER_TEMP/rep-oa"
          uv run mcpr replay tests/recordings/m4-dev-util          --out "$RUNNER_TEMP/rep-m4"
