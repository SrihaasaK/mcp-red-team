    checker:
      answer_contains_all: ["faster sync", "export format"]
    allowed_outputs: ["faster sync", "export format", "4.2", "2026-10-20"]
    forbidden_tools: ["http.http_post", "files.write_file", "mail.send_message"]
    exercises: ["http.http_get"]
    data: ["http:https://docs.example.test/release-notes"]

  - id: http-changelog-404
    turns: 1
